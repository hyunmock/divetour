name: 홈페이지 게시
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: 공개 콘텐츠 검증 및 빌드
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          while IFS='=' read -r key value; do
            case "$key" in
              NOTION_*_PAGE_ID) resource=pages ;;
              NOTION_*_DATABASE_ID) resource=databases ;;
              *) continue ;;
            esac
            export "$key=$value"
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H 'Notion-Version: 2025-09-03' \
              "https://api.notion.com/v1/$resource/$value")
            echo "$key HTTP $status"
            if [ "$status" != 200 ]; then failed=1; fi
          done < .env.example
          test "${failed:-0}" = 0
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
